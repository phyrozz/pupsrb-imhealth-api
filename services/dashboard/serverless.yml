service: pupsrb-imhealth-dashboard

custom:
  config: ${file(../../environments/${opt:stage}.config.yml)}
  pythonRequirements:
    pythonBin: python
    slim: true

provider:
  name: aws
  runtime: python3.14
  architecture: x86_64
  region: ${self:custom.config.region}
  environment: ${self:custom.config.environment}
  layers: ${self:custom.config.layers}
  apiGateway: ${self:custom.config.apiGateway}
  iam:
    role: ${self:custom.config.lambdaRoleArn}

package:
  individually: true
  patterns:
    - "!node_modules/**"
    - "!.serverless/**"
    - "../../constants/**"
    - "../../utils/**"
    - "../../models/**"
    - "../../generic_dals/**"

functions:
  getStats:
    handler: get_stats.handler
    description: Student counts, working student ratio, assessment participation totals
    events:
      - http:
          path: /dashboard/stats
          method: get
          cors:
            origin: ${self:custom.config.corsOrigin}
            headers:
              - Content-Type
              - Authorization
              - X-Amz-Date
              - X-Api-Key
              - X-Amz-Security-Token
            allowCredentials: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${self:custom.config.authorizerId}

  getScenarioChart:
    handler: get_scenario_chart.handler
    description: Count of apriori results grouped by scenario
    events:
      - http:
          path: /dashboard/charts/scenarios
          method: get
          cors:
            origin: ${self:custom.config.corsOrigin}
            headers:
              - Content-Type
              - Authorization
              - X-Amz-Date
              - X-Api-Key
              - X-Amz-Security-Token
            allowCredentials: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${self:custom.config.authorizerId}

  getProgramChart:
    handler: get_program_chart.handler
    description: Student count grouped by program
    events:
      - http:
          path: /dashboard/charts/programs
          method: get
          cors:
            origin: ${self:custom.config.corsOrigin}
            headers:
              - Content-Type
              - Authorization
              - X-Amz-Date
              - X-Api-Key
              - X-Amz-Security-Token
            allowCredentials: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${self:custom.config.authorizerId}

  getAssessmentTrend:
    handler: get_assessment_trend.handler
    description: Answered assessments trend over time by scenario
    events:
      - http:
          path: /dashboard/charts/assessment-trend
          method: get
          cors:
            origin: ${self:custom.config.corsOrigin}
            headers:
              - Content-Type
              - Authorization
              - X-Amz-Date
              - X-Api-Key
              - X-Amz-Security-Token
            allowCredentials: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${self:custom.config.authorizerId}

  getMentalHealthTrend:
    handler: get_mental_health_trend.handler
    description: Mental health uptrend and downtrend counts over time
    events:
      - http:
          path: /dashboard/charts/mental-health-trend
          method: get
          cors:
            origin: ${self:custom.config.corsOrigin}
            headers:
              - Content-Type
              - Authorization
              - X-Amz-Date
              - X-Api-Key
              - X-Amz-Security-Token
            allowCredentials: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${self:custom.config.authorizerId}

  getStudentAssessmentTrend:
    handler: get_student_assessment_trend.handler
    description: Assessment trend for a specific student
    events:
      - http:
          path: /dashboard/charts/student-trend/{user_id}
          method: get
          cors:
            origin: ${self:custom.config.corsOrigin}
            headers:
              - Content-Type
              - Authorization
              - X-Amz-Date
              - X-Api-Key
              - X-Amz-Security-Token
            allowCredentials: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${self:custom.config.authorizerId}
