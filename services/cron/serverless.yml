service: pupsrb-imhealth-cron

custom:
  config: ${file(../../environments/${opt:stage}.config.yml)}
  pythonRequirements:
    pythonBin: python
    slim: true

provider:
  name: aws
  runtime: python3.14
  architecture: x86_64
  region: ${self:custom.config.region}
  environment: ${self:custom.config.environment}
  layers: ${self:custom.config.layers}
  apiGateway: ${self:custom.config.apiGateway}
  iam:
    role: ${self:custom.config.lambdaRoleArn}

package:
  individually: true
  patterns:
    - "!node_modules/**"
    - "!.serverless/**"
    - "../../constants/**"
    - "../../utils/**"
    - "../../models/**"
    - "../../generic_dals/**"

functions:
  scheduledTrendSnapshot:
    handler: task_runner.scheduled_handler
    description: Starts the daily mental health trend snapshot task
    timeout: 30
    events:
      - schedule:
          rate: cron(0 1 * * ? *)
          enabled: true

  taskRunner:
    handler: task_runner.handler
    description: Triggers ECS Fargate task to run cron business logic
    timeout: 30
    events:
      - http:
          path: /task-runner
          method: post
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${self:custom.config.authorizerId}
