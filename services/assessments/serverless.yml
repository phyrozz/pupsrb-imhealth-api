service: pupsrb-imhealth-assessments

custom:
  config: ${file(../../environments/${opt:stage}.config.yml)}
  pythonRequirements:
    pythonBin: python
    slim: true

provider:
  name: aws
  runtime: python3.14
  architecture: x86_64
  region: ${self:custom.config.region}
  environment: ${self:custom.config.environment}
  layers: ${self:custom.config.layers}
  apiGateway: ${self:custom.config.apiGateway}
  iam:
    role: ${self:custom.config.lambdaRoleArn}

package:
  individually: true
  patterns:
    - "!node_modules/**"
    - "!.serverless/**"
    - "../../constants/**"
    - "../../utils/**"
    - "../../models/**"
    - "../../generic_dals/**"

functions:
  submitAssessment:
    handler: submit_assessment.handler
    events:
      - http:
          path: /assessments
          method: post
          cors:
            origin: ${self:custom.config.corsOrigin}
            headers:
              - Content-Type
              - Authorization
              - X-Amz-Date
              - X-Api-Key
              - X-Amz-Security-Token
            allowCredentials: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${self:custom.config.studentAuthorizerId}

  listAssessments:
    handler: list_assessments.handler
    events:
      - http:
          path: /assessments
          method: get
          cors:
            origin: ${self:custom.config.corsOrigin}
            headers:
              - Content-Type
              - Authorization
              - X-Amz-Date
              - X-Api-Key
              - X-Amz-Security-Token
            allowCredentials: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${self:custom.config.authorizerId}

  getAprioriResult:
    handler: get_apriori_result.handler
    events:
      - http:
          path: /assessments/{assessment_id}/apriori
          method: get
          cors:
            origin: ${self:custom.config.corsOrigin}
            headers:
              - Content-Type
              - Authorization
              - X-Amz-Date
              - X-Api-Key
              - X-Amz-Security-Token
            allowCredentials: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${self:custom.config.authorizerId}

  updateCounselingStatus:
    handler: update_counseling_status.handler
    events:
      - http:
          path: /assessments/{assessment_id}/counseling-status
          method: put
          cors:
            origin: ${self:custom.config.corsOrigin}
            headers:
              - Content-Type
              - Authorization
              - X-Amz-Date
              - X-Api-Key
              - X-Amz-Security-Token
            allowCredentials: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${self:custom.config.authorizerId}

  sendStatusUpdateEmail:
    handler: send_status_update_email.handler
    events:
      - http:
          path: /assessments/send-status-email
          method: post
          cors:
            origin: ${self:custom.config.corsOrigin}
            headers:
              - Content-Type
              - Authorization
              - X-Amz-Date
              - X-Api-Key
              - X-Amz-Security-Token
            allowCredentials: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${self:custom.config.authorizerId}
