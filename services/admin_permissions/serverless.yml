service: pupsrb-imhealth-admin-permissions

custom:
  config: ${file(../../environments/${opt:stage}.config.yml)}
  pythonRequirements:
    pythonBin: python
    slim: true

provider:
  name: aws
  runtime: python3.14
  architecture: x86_64
  region: ${self:custom.config.region}
  environment: ${self:custom.config.environment}
  layers: ${self:custom.config.layers}
  apiGateway: ${self:custom.config.apiGateway}
  iam:
    role: ${self:custom.config.lambdaRoleArn}

package:
  individually: true
  patterns:
    - "!node_modules/**"
    - "!.serverless/**"
    - "../../constants/**"
    - "../../utils/**"
    - "../../models/**"
    - "../../generic_dals/**"

functions:
  getMyPermissions:
    handler: admin_permissions.handler
    events:
      - http:
          path: /role-permissions/me
          method: get
          cors:
            origin: ${self:custom.config.corsOrigin}
            headers: [Content-Type, Authorization, X-Amz-Date, X-Api-Key, X-Amz-Security-Token]
            allowCredentials: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${self:custom.config.authorizerId}

  getPermissionMatrix:
    handler: admin_permissions.handler
    events:
      - http:
          path: /role-permissions
          method: get
          cors:
            origin: ${self:custom.config.corsOrigin}
            headers: [Content-Type, Authorization, X-Amz-Date, X-Api-Key, X-Amz-Security-Token]
            allowCredentials: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${self:custom.config.authorizerId}

  updateRolePermissions:
    handler: admin_permissions.handler
    events:
      - http:
          path: /role-permissions/{role_id}
          method: put
          cors:
            origin: ${self:custom.config.corsOrigin}
            headers: [Content-Type, Authorization, X-Amz-Date, X-Api-Key, X-Amz-Security-Token]
            allowCredentials: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${self:custom.config.authorizerId}
