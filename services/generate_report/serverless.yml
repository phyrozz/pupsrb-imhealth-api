service: pupsrb-imhealth-generate-report

custom:
  config: ${file(../../environments/${opt:stage}.config.yml)}
  pythonRequirements:
    pythonBin: python
    slim: true

provider:
  name: aws
  runtime: python3.14
  architecture: x86_64
  region: ${self:custom.config.region}
  environment: ${self:custom.config.environment}
  layers: ${self:custom.config.layers}
  apiGateway: ${self:custom.config.apiGateway}
  iam:
    role: ${self:custom.config.lambdaRoleArn}

package:
  individually: true
  patterns:
    - "!node_modules/**"
    - "!.serverless/**"
    - "../../constants/**"
    - "../../utils/**"
    - "../../models/**"
    - "../../generic_dals/**"

functions:
  taskRunner:
    name: pupsrb-imhealth-generate-report-${opt:stage, 'dev'}
    handler: task_runner.handler
    description: Starts an isolated Fargate task that generates and emails an administrator report.
    timeout: 30
    events:
      - http:
          path: /generate-report
          method: post
          cors:
            origin: ${self:custom.config.corsOrigin}
            headers: [Content-Type, Authorization, X-Amz-Date, X-Api-Key, X-Amz-Security-Token]
            allowCredentials: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: ${self:custom.config.authorizerId}
